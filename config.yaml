# ─── Wan 2.2 I2V AMD Video Generator — Config ──────────────────────
# All paths are relative to the container's /app mount or absolute.

# HuggingFace model ID — used to download text_encoder, vae, image_encoder, scheduler, etc.
# The transformer weights come from local GGUF files instead (much smaller, fits in VRAM).
model_id: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"

# ─── GGUF transformer checkpoints (local) ──────────────────────────
# These are loaded via WanTransformer3DModel.from_single_file() with
# GGUFQuantizationConfig.  Q6_K ≈ 10 GB each → fits in 24 GB VRAM
# with group offloading.
gguf_transformer_high: "models/unet/Wan2.2-I2V-A14B-HighNoise-Q6_K.gguf"
gguf_transformer_low:  "models/unet/Wan2.2-I2V-A14B-LowNoise-Q6_K.gguf"

# ─── LoRA configuration ────────────────────────────────────────────
# Each entry: path (local .safetensors), target (transformer|transformer_2),
# adapter_name, scale.
# NOTE on GGUF + LoRA: LoRAs CANNOT be fused into GGUF weights (shape mismatch).
# They run unfused at inference time (small overhead, but works correctly).
# LoRAs are loaded BEFORE group offloading is applied.
loras:
  # --- LightX2V step-distillation LoRA (50→4-8 steps) ---
  # Same file for BOTH high and low noise transformers
  - path: "models/loras/Wan21_I2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors"
    target: "transformer"
    adapter_name: "lightx2v_high"
    scale: 3.0

  - path: "models/loras/Wan21_I2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors"
    target: "transformer_2"
    adapter_name: "lightx2v_low"
    scale: 3.0

  # --- wan2.2 t2v speed LoRAs ---
  - path: "models/loras/wan2.2_t2v_A14b_high_noise_lora_rank64_lightx2v_4step_1217.safetensors"
    target: "transformer"
    adapter_name: "t2v_speed_high"
    scale: 1.0

  - path: "models/loras/wan2.2_t2v_A14b_low_noise_lora_rank64_lightx2v_4step_1217.safetensors"
    target: "transformer_2"
    adapter_name: "t2v_speed_low"
    scale: 1.0

  # --- NS quality LoRAs ---
  - path: "models/loras/NS-22-H-e8.safetensors"
    target: "transformer"
    adapter_name: "ns_high"
    scale: 0.9

  - path: "models/loras/NS-22-L-e8.safetensors"
    target: "transformer_2"
    adapter_name: "ns_low"
    scale: 0.9

  # --- DR3 quality LoRAs ---
  - path: "models/loras/DR3_I2V_14B_HIGH_V2.safetensors"
    target: "transformer"
    adapter_name: "dr3_high"
    scale: 0.9

  - path: "models/loras/DR3_I2V_14B_LOW_V2.safetensors"
    target: "transformer_2"
    adapter_name: "dr3_low"
    scale: 0.9

  # --- Sparse/temporal LoRAs ---
  - path: "models/loras/s_t_HighNoise_merged3_7_v2.safetensors"
    target: "transformer"
    adapter_name: "st_high"
    scale: 0.3

  - path: "models/loras/s_t_LowNoise_merged3_7_v2.safetensors"
    target: "transformer_2"
    adapter_name: "st_low"
    scale: 0.3

# ─── Generation settings ───────────────────────────────────────────
prompt: "A cat walking gracefully across a sunlit garden path, cinematic lighting, 4K quality"
negative_prompt: "Bright tones, overexposed, static, blurred details, subtitles, style, works, paintings, images, static, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, many people in the background, walking backwards"

input_image: "input/input.png"
output_path: "output/video.mp4"

# Video dimensions (must be multiples of 16)
width: 832
height: 480
num_frames: 81         # 4k+1 rule → (81-1)/4 = 20 latent frames
fps: 16
duration: 5.0          # Video length in seconds (frames auto-calculated from duration × fps)
output_fps: 24         # Output framerate after RIFE interpolation (0 = same as fps)

# ─── Sampler / scheduler ───────────────────────────────────────────
num_inference_steps: 16     # TOTAL steps (split between high & low via boundary_ratio)
guidance_scale: 5.0         # CFG for high-noise pass (>1.0 enables CFG, 5.0 is reference default)
guidance_scale_2: 5.0       # CFG for low-noise pass (if None → same as guidance_scale)
flow_shift: 8.0             # 8.0 for I2V (5.0 for 720p T2V, 3.0 for 480p T2V)
seed: 42                    # -1 for random

# ─── Two-stage boundary ────────────────────────────────────────────
# Reference WanImageToVideoPipeline approach:
#   boundary_timestep = boundary_ratio × num_train_timesteps (1000)
#   timesteps >= boundary → high-noise transformer
#   timesteps < boundary  → low-noise transformer
# With flow_shift=8.0 and 16 steps, ratio=0.618 gives ~14 high + 2 low steps
# Higher ratio → more steps go to high-noise, fewer to low-noise
boundary_ratio: 0.618

# ─── Memory management ─────────────────────────────────────────────
# group_offload: moves transformer blocks CPU↔GPU on-the-fly
# Drastically cuts peak VRAM (24GB → ~14GB usable for 14B model)
enable_group_offload: true
offload_type: "block_level"  # "block_level" (fewer PCIe transfers, better GPU util) or "leaf_level"
num_blocks_per_group: 1      # For block_level: how many transformer blocks per group (1=minimal VRAM, higher=faster)
use_stream: false            # MUST be false for AMD/HIP (CUDA streams broken on ROCm)

# ─── Text encoder settings ─────────────────────────────────────────
# Device strategy for the ~12 GB UMT5 text encoder:
#   "auto" — smart split: measures free VRAM and places as many encoder
#            layers on GPU as fit, spilling the rest to CPU.  Best of
#            both worlds — max GPU speed, no OOM.
#   "cpu"  — entire encoder on CPU (safe fallback, ~10s slower).
#   "gpu"  — entire encoder on GPU (needs >12 GB free VRAM).
text_encoder_device: "auto"
# VRAM headroom (GiB) kept free when using "auto" strategy.
# Lower = more layers on GPU (faster) but riskier.  1.0-2.0 is safe.
text_encoder_gpu_headroom_gb: 1.0

# ─── VAE settings ──────────────────────────────────────────────────
# VAE must stay float32 for quality; we tile it to fit in VRAM
vae_tiling: true
vae_slicing: true
# Force VAE encode/decode on CPU to avoid GPU OOM during latent prep.
# Slower but guarantees no VRAM spike.  Set false for faster GPU VAE.
force_vae_cpu: false

# ─── Upscale (optional, post-generation) ───────────────────────────
enable_upscale: false
upscale_model: "models/upscale_models/4x_NMKD-Siax_200k.pth"
rife_model: "models/upscale_models/rife47.pth"

# ─── AMD-specific tuning ───────────────────────────────────────────
amd:
  # Force gfx1100 ISA (7900 XTX)
  hsa_override_gfx_version: "11.0.0"
  # Expandable VRAM segments — avoids fragmentation OOMs
  pytorch_hip_alloc_conf: "expandable_segments:True"
  # Torch compile (experimental on ROCm — disable if it hangs)
  enable_torch_compile: false
  compile_mode: "reduce-overhead"   # or "max-autotune"
  # Use float16 instead of bfloat16 if ROCm bfloat16 is slow
  force_fp16: false
